<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReVibe · used & unused marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Header -->
    <div class="header">
      <div class="logo-area">
        <h1><i class="fas fa-recycle"></i> ReVibe</h1>
        <p>used &amp; unused · buy &amp; sell with trust</p>
      </div>
      <div class="stats-badge">
        <i class="fas fa-box-open"></i>
        <span id="headerItemCount">0</span> items listed
      </div>
    </div>

    <!-- Add item form -->
    <div class="form-card">
      <h2><i class="fas fa-plus-circle"></i> List a new item</h2>
      <div class="input-grid">
        <div class="input-group">
          <label for="itemName">Item name</label>
          <input type="text" id="itemName" placeholder="e.g. Vintage lamp" maxlength="40" />
        </div>
        <div class="input-group">
          <label for="itemPrice">Price ($)</label>
          <input type="number" id="itemPrice" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="input-group">
          <label for="itemCondition">Condition</label>
          <select id="itemCondition">
            <option value="unused">✨ Unused</option>
            <option value="used">🔄 Used</option>
          </select>
        </div>
        <div class="input-group">
          <label for="itemDesc">Short description</label>
          <input type="text" id="itemDesc" placeholder="optional, e.g. light wear" maxlength="60" />
        </div>
        <button class="btn-add" id="addItemBtn">
          <i class="fas fa-cloud-upload-alt"></i> Add to list
        </button>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all"><i class="fas fa-layer-group"></i> All</button>
        <button class="filter-btn" data-filter="unused"><i class="fas fa-sparkles"></i> Unused</button>
        <button class="filter-btn" data-filter="used"><i class="fas fa-history"></i> Used</button>
      </div>
      <div class="item-count" id="visibleCount">Showing 0 items</div>
    </div>

    <!-- Product grid -->
    <div class="product-grid" id="productGrid"></div>

    <div class="footer-note">
      <i class="fas fa-leaf" style="margin-right: 8px; color: #8fae9a;"></i>
      ReVibe — give things a second life
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
